<div class="calendar-container">
  <div class="calendar">
    <div class="calendar-header">
      <button (click)="previousYear()"> << </button>
      <button (click)="previousMonth()"> < </button>
      <h2>{{ monthNames[currentDate.getMonth()] }} {{ currentDate.getFullYear() }}</h2>
      <button (click)="nextMonth()"> > </button>
      <button (click)="nextYear()"> >> </button>
    </div>
    <div class="calendar-days-header">
      <div *ngFor="let dayName of dayNames" class="day-name">{{ dayName }}</div>
    </div>
    <div class="calendar-days">
      <div *ngFor="let day of days" class="day" [ngClass]="{ 'today': isToday(day), 
      'other-month': !isSelectedMonth(day),
      'past' : isPast(day),
      'selected': isSelectedDate(day) }" (click)="!isPast(day) && selectDate(day)">
        {{ day ? day.getDate() : '' }}
      </div>
    </div>
    </div>
    <div class="time-slot-container">
      <app-time-slot *ngIf="selectedDate" [selectedDate]="selectedDate"></app-time-slot>
  </div>
</div>
